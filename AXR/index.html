<main>
    <section class="card" color="#f2f2f2">
        <p>Text test, lets see if the custom build process works!!!</p>
        <img src="/-assets/LordSkin.png" alt="Lord Axos Akulonni-Katra's appearance" height="500" width="auto">
    </section>
</main>

<script>
    const themeToggle = document.getElementById('themeToggle');
    const htmlElement = document.documentElement;

    // Load theme preference from localStorage
    const currentTheme = localStorage.getItem('theme') || 'dark';
    if (currentTheme === 'light') {
        htmlElement.classList.add('light-mode');
        themeToggle.textContent = '☀︎';
    }

    themeToggle.addEventListener('click', () => {
        htmlElement.classList.toggle('light-mode');
        const isLight = htmlElement.classList.contains('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        themeToggle.textContent = isLight ? '☀︎' : '⏾';
    });
</script>

</body>
</html>
